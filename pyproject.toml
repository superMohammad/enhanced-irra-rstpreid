[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "enhanced-irra"
version = "0.1.0"
description = "Research on learning to match person descriptions with images"
requires-python = ">=3.11,<3.13"
dependencies = [
  "torch==2.7.1", "torchvision==0.22.1", "numpy==2.2.6",
  "Pillow==11.2.1", "matplotlib==3.10.3", "pandas==2.2.3",
  "ftfy==6.3.1", "regex==2024.11.6", "tqdm==4.67.1",
  "nbformat==5.10.4", "nbclient==0.10.2", "ipykernel>=6.29,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.11,<0.12", "mypy>=1.15,<1.16", "pandas-stubs", "types-tqdm", "types-regex"]
notebook = ["jupyterlab>=4,<5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"enhanced_irra.vendor" = ["*.pyi", "data/*.gz", "LICENSE", "CLIP_LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
exclude = ["external", "src/enhanced_irra/vendor", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["vendor", "external", "tests"]

[[tool.mypy.overrides]]
module = ["enhanced_irra.vendor.*", "matplotlib.*", "torchvision.*", "PIL.*", "nbformat.*", "nbclient.*"]
ignore_missing_imports = true
follow_imports = "skip"
